<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karaoke</title>
<meta name="apple-mobile-web-app-title" content="Karaoke">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a1838">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Playfair+Display:ital,wght@1,700&family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5eee3;--surface:#fffaf2;--ink:#2a1838;--muted:#7a6a86;--line:#e3d6c6;--accent:#e4375b;--on:#fff;--gold:#a8741a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150b20;--surface:#221232;--ink:#fff4e0;--muted:#b8a6c6;--line:#3a2650;--gold:#e3b45a}}
:root[data-theme="dark"]{--bg:#150b20;--surface:#221232;--ink:#fff4e0;--muted:#b8a6c6;--line:#3a2650;--gold:#e3b45a}
html{scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:17px;line-height:1.6;min-height:100vh;overscroll-behavior:none}
body.lock{position:fixed;inset:0;overflow:hidden;width:100%}
h1,h2{font-family:"Reem Kufi","Tajawal",system-ui,sans-serif;margin:0;font-weight:700}
h1{font:italic 700 2.4rem/1.1 "Playfair Display",Georgia,serif;direction:ltr;color:var(--gold);letter-spacing:.5px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
#home{padding-bottom:110px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
button,input,textarea,select{font:inherit;color:inherit}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--on);min-height:46px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.92rem}
.btn.wide{width:100%;margin-top:10px}
.btn.del,.del{color:var(--accent)}
.fi{position:relative;overflow:hidden}
.fi input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
:is(.btn,.song,.chip,.srow,.star,input,textarea):focus-visible{outline:3px solid #ffb703;outline-offset:2px}
input[type=text],input[type=search],input[type=number],textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;color:var(--ink)}
#q{border-radius:999px;padding:11px 18px}
textarea{min-height:200px;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools{display:flex;gap:8px;margin-bottom:8px}
.songs{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.song{flex:1;display:flex;align-items:center;gap:14px;text-align:start;background:transparent;border:0;padding:12px 4px;cursor:pointer;min-width:0}
.av{flex:none;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 1.35rem "Reem Kufi","Tajawal",sans-serif;color:#fff}
.tx{min-width:0}
.song b{display:block;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star,.mv{flex:none;width:44px;height:44px;background:transparent;border:0;border-radius:50%;font-size:1.3rem;cursor:pointer;color:var(--muted)}
.star[aria-pressed=true]{color:#e8a200}
.empty{padding:26px 16px;border:2px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted)}
.row{display:flex;gap:6px;align-items:stretch}
.fab{position:fixed;inset-inline-end:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:2rem;line-height:1;box-shadow:0 4px 14px #0004;cursor:pointer}
.field{display:block;margin-bottom:14px}.field>span,.lbl{display:block;font-weight:700;margin-bottom:6px}
.hint{color:var(--muted);font-size:.92rem;margin:4px 0 0}
.srow{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:start;background:var(--surface);border:0;border-bottom:1px solid var(--line);padding:14px 6px;cursor:pointer}
.srow b{display:block}.srow small{color:var(--muted)}
.set{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.set input[type=range]{grid-column:1/-1;accent-color:var(--accent);width:100%}
.set input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}
.set .opts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw[aria-pressed=true]{border-color:var(--accent)}
.pv{margin:12px 0;padding:22px 12px;border-radius:16px;text-align:center}
.delb{background:none;border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--muted);cursor:pointer}
.delb.sure{border-color:var(--accent);color:var(--accent)}
.blk{display:grid;gap:10px;margin:14px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:30;max-width:90%;text-align:center}
[hidden]{display:none!important}

/* stage */
#stage{--stage:#2a1838;--sink:#fff4e0;--glow:#ffb703;--fs:1.7rem;--sc:1.3;--gap:22px;--ff:"Reem Kufi","Tajawal",system-ui,sans-serif;--lift:24px;position:fixed;top:0;left:0;right:0;height:100vh;z-index:5;display:flex;flex-direction:column;color:var(--sink);overscroll-behavior:none;touch-action:manipulation;
background:radial-gradient(ellipse at 50% 45%,#ffffff17,#0000 62%),var(--stage);padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--lift))}
#stage .btn{background:#ffffff22;color:var(--sink)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px}
.bar h2{font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:center}
.btn.ic{min-width:46px;padding:8px 10px;font-size:1.2rem}
#lines{position:relative;flex:1;overflow-y:auto;min-height:0;padding:30vh 18px;text-align:center;scroll-behavior:smooth;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ln{font-family:var(--ff);font-size:var(--fs);line-height:1.4;margin:0 0 var(--gap);opacity:.28;transition:opacity .3s,font-size .3s;cursor:pointer}
.ln.past{opacity:.4}.ln.nxt{opacity:.6}
.ln.on{opacity:1;font-size:calc(var(--fs)*var(--sc));filter:drop-shadow(0 0 10px var(--glow))}
.ln .w.d{color:var(--glow)}
.ln.rtl .w.c{background:linear-gradient(to left,var(--glow) calc(var(--q)*100%),var(--sink) calc(var(--q)*100%));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.ln.ltr .w.c{background:linear-gradient(to right,var(--glow) calc(var(--q)*100%),var(--sink) calc(var(--q)*100%));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
#stage.focus .ln{opacity:0}#stage.focus .ln.nxt{opacity:.45}#stage.focus .ln.on{opacity:1}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 9rem/1 "Reem Kufi",sans-serif;color:var(--glow);background:#0000008c;pointer-events:none;z-index:2}
.ctl{padding:10px 12px 12px;display:grid;gap:8px;background:#00000052;border-radius:22px 22px 0 0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ctl .r{display:flex;gap:8px;align-items:stretch;direction:ltr}.ctl .r>*{flex:1}
.ctl .r.main .btn{min-height:54px;font-size:1.15rem}
.ctl .r.main .play{flex:1.5;background:var(--glow);color:#1b1030;font-size:1.5rem}
.ctl .r.main .sm{flex:.8;font-size:.95rem}
.seek{display:flex;align-items:center;gap:10px;font-size:.85rem;direction:ltr}.seek input{flex:1;accent-color:var(--glow);height:32px}
.tap{min-height:92px!important;font-size:1.25rem;background:var(--glow)!important;color:#1b1030!important;border-radius:20px;touch-action:none}
.splabel{margin:0;text-align:center;opacity:.8;min-height:1.6em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#showBtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);inset-inline-end:10px;z-index:4;opacity:.5;display:none}
#stage.clean #showBtn{display:inline-flex}
#stage.clean .bar,#stage.clean .ctl{display:none}
#stage.sh .ctl{display:none}
#sheet{background:#0b0614f5;border-radius:22px 22px 0 0;max-height:56%;display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;gap:6px;padding:10px 10px 6px;align-items:center;overflow-x:auto;direction:ltr}
#tabs .chip{color:var(--sink);border-color:#ffffff33}#tabs .chip[aria-pressed=true]{background:var(--glow);color:#1b1030;border-color:var(--glow)}
#sheetBody{overflow-y:auto;padding:4px 14px 14px;overscroll-behavior:contain}
#stage .set{border-color:#ffffff22}#stage .hint{color:#fff4e0aa}
#stage .set input[type=range]{accent-color:var(--glow)}#stage .set input[type=checkbox]{accent-color:var(--glow)}
#stage input[type=number]{background:#ffffff18;color:var(--sink);border-color:#ffffff33;width:80px;text-align:center}
#stage .sw[aria-pressed=true]{border-color:var(--sink)}
#stage .chip{color:var(--sink);border-color:#ffffff33}#stage .chip[aria-pressed=true]{background:var(--glow);color:#1b1030}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
#tedit,#lrcBox,#calib{position:absolute;inset:0;z-index:6;background:var(--stage);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 4px) 12px calc(env(safe-area-inset-bottom,0px) + var(--lift));gap:8px}
#teList{flex:1;overflow-y:auto;overscroll-behavior:contain}
.tr{padding:10px 4px;border-bottom:1px solid #ffffff22}
.tr.cur{background:#ffffff14;border-radius:10px}
.trh{display:flex;gap:10px;align-items:center}
.tt{font-family:system-ui,sans-serif;direction:ltr;color:var(--glow);min-width:64px}
.tl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trb{display:none;gap:6px;margin-top:6px;direction:ltr}.tr.sel .trb{display:flex}.trb .btn{flex:1}.trh{cursor:pointer}
.te-in{flex:1;background:#ffffff18;color:var(--sink);border:1.5px solid #ffffff44;border-radius:10px;padding:6px 10px;min-width:0}
#stage.syncing #lines{touch-action:none;overflow:hidden}
.bar2{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.bar2 .btn{background:var(--accent);color:#fff;flex:none}
.cloud{align-self:center;font-size:.9rem;color:var(--muted);padding:0 4px}
.notice{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:10px;font-size:.92rem}
#lrcBox textarea{flex:1;background:#ffffff14;color:var(--sink);border-color:#ffffff33}
@media (prefers-reduced-motion:reduce){#lines{scroll-behavior:auto}.ln{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="home">
  <header><h1>Karaoke</h1><div class="row"><button class="btn ghost sm" id="langBtn"></button><button class="btn ghost sm" id="gearBtn" data-i="settings"></button></div></header>
  <input type="search" id="q" data-ip="search">
  <div class="chips" id="chips"></div>
  <div class="tools"><button class="btn ghost sm" id="sortBtn"></button><label class="btn ghost sm fi"><span data-i="bulk"></span><input type="file" id="bulk" multiple></label></div>
  <div id="install" class="notice" hidden><span data-i="installHint"></span><button class="btn sm ghost" id="installX">✕</button></div>
  <div id="relink" class="notice" hidden><span id="relinkT"></span><label class="btn sm fi"><span data-i="relink"></span><input type="file" id="relinkIn" multiple></label></div>
  <ul class="songs" id="list"></ul>
  <button class="fab" id="addBtn" aria-label="+">+</button>
</div>

<div class="wrap" id="editor" hidden>
  <header><h2 id="edTitle"></h2><button class="btn ghost" id="cancelBtn" data-i="back"></button></header>
  <label class="field"><span data-i="fieldTitle"></span><input type="text" id="title" autocomplete="off"></label>
  <label class="field"><span data-i="fieldCat"></span><input type="text" id="cat" autocomplete="off" data-ip="catPh"></label>
  <label class="field"><span data-i="fieldLyrics"></span><textarea id="lyrics" data-ip="lyricsPh"></textarea><p class="hint" data-i="lyricsHint"></p></label>
  <div class="field"><span class="lbl" data-i="fieldAudio"></span>
    <label class="btn ghost fi"><span data-i="chooseFile"></span><input type="file" id="audio"></label>
    <p class="hint" id="audioInfo"></p><p class="hint" data-i="audioHint"></p></div>
  <button class="btn wide" id="saveBtn" data-i="saveStart"></button>
  <button class="btn ghost wide del" id="delSong" data-i="delSong" hidden></button>
</div>

<div class="wrap" id="settings" hidden>
  <header><h2 id="setTitle"></h2><button class="btn ghost" id="setBack" data-i="back"></button></header>
  <div id="setBody"></div>
</div>

<div id="stage" hidden>
  <div class="bar"><button class="btn" id="backBtn" data-i="end"></button><h2 id="stTitle"></h2><button class="btn ic" id="hideBtn" aria-label="hide">⤢</button><button class="btn ic" id="moreBtn" aria-label="more">⋯</button></div>
  <div id="lines"></div>
  <div id="cd" hidden></div>
  <button class="btn ic" id="showBtn" aria-label="show">⤡</button>
  <div class="ctl">
    <div id="pcard" style="display:grid;gap:8px">
      <div class="seek aud"><span id="tc">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="td">0:00</span></div>
      <div class="r main"><button class="btn sm aud" id="back10">−10</button><button class="btn" id="prevBtn">⏮︎</button><button class="btn play" id="playBtn">▶︎</button><button class="btn" id="nextBtn">⏭︎</button><button class="btn sm aud" id="fwd10">+10</button></div>
      <div class="r"><button class="btn sm" id="fontMinus">A−</button><button class="btn sm" id="fontPlus">A+</button><button class="btn sm" id="rateBtn">1x</button><button class="btn sm" id="loopBtn">↻</button><button class="btn sm" id="syncOpen">⏱︎</button></div>
    </div>
    <div id="spad" hidden style="display:grid;gap:8px">
      <p class="splabel" id="spLine"></p>
      <button class="btn tap" id="tapBtn"></button>
      <div class="r"><button class="btn sm" id="spUndo"></button><button class="btn sm" id="spStop"></button></div>
    </div>
  </div>
  <div id="sheet" hidden><div id="tabs"></div><div id="sheetBody"></div></div>
  <div id="tedit" hidden>
    <div class="bar"><button class="btn" id="teDone" data-i="done"></button><h2 id="teTitle"></h2><span style="width:46px"></span></div>
    <p class="hint" id="teNote" style="margin:0"></p>
    <label class="set"><span data-i="shiftRest"></span><input type="checkbox" id="teShift"></label>
    <div id="teList"></div>
    <div class="r" style="display:flex;gap:8px;direction:ltr"><button class="btn sm" id="teM5" style="flex:1">−5</button><button class="btn" id="tePlay" style="flex:2;background:var(--glow);color:#1b1030">▶︎</button><button class="btn sm" id="teP5" style="flex:1">+5</button><b id="teT" style="flex:1;text-align:center;align-self:center;direction:ltr">0:00</b></div>
  </div>
  <div id="lrcBox" hidden>
    <div class="bar"><button class="btn" id="lrcClose" data-i="back"></button><h2 data-i="importLrc"></h2><span style="width:46px"></span></div>
    <p class="hint" data-i="lrcHint" style="margin:0"></p>
    <textarea id="lrcTxt" dir="ltr" placeholder="[00:12.30] ..."></textarea>
    <div class="two"><label class="btn fi"><span data-i="chooseFile"></span><input type="file" id="lrcFile"></label><button class="btn" id="lrcApply" style="background:var(--glow);color:#1b1030" data-i="apply"></button></div>
  </div>
  <div id="calib" hidden>
    <div class="bar"><button class="btn" id="calClose" data-i="back"></button><h2 data-i="calibrate"></h2><span style="width:46px"></span></div>
    <p class="hint" data-i="calHint" style="margin:0"></p>
    <p id="calN" class="splabel" style="font-size:1.4rem"></p>
    <button class="btn tap" id="calTap" data-i="calTap"></button>
  </div>
</div>
<div id="upBar" class="bar2" hidden><span data-i="updateAvail"></span><button class="btn sm" id="upGo" data-i="updateGo"></button></div>
<div id="saveBar" class="bar2" hidden><span id="saveT"></span><button class="btn sm" id="saveGo" data-i="saveGo"></button></div>
<div id="toast" hidden></div>
<audio id="player" preload="auto"></audio>

  while(raw.length&&!raw[0])raw.shift();while(raw.length&&!raw[raw.length-1])raw.pop();
  var items=[],pb=false;raw.forEach(function(l){if(l){items.push({w:Math.max(8,l.length),p:pb});pb=false}else pb=true});
  var avg=items.reduce(function(s,x){return s+x.w},0)/items.length,pw=avg*0.8,tot=0,acc=0,out=[];
  items.forEach(function(x){tot+=x.w+(x.p?pw:0)});
  items.forEach(function(x){if(x.p)acc+=pw;out.push(a+acc/tot*(b-a)-off());acc+=x.w});
  return out}
